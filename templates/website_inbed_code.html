<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>2X Criteria Assistant – Embedded</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      overflow-x: hidden;
      background: #f5f5f5;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .embed-wrapper {
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 16px;
      display: flex;
      justify-content: center;
    }

    .embed-wrapper iframe {
      display: block;
      width: 100%;
      max-width: 1120px;
      margin: 0 auto;
      border: none;
      border-radius: 12px;
      background: #ffffff;
      min-height: 520px;
    }
	.embed-frame {
	  width: 100%;
	  max-width: 1120px;
	  margin: 20px auto;          /* restores top/bottom wrap */
	  padding: 18px;              /* restores inner breathing room */
	  background: transparent;
	  padding: 20px;
	  border-radius: 14px;
	  box-shadow: 0 12px 30px rgba(0,0,0,0.10);
	}
    @media (max-width: 640px) {
      .embed-wrapper {
        margin: 16px auto;
        padding: 0 !important;
      }

      .embed-wrapper iframe {
        border-radius: 10px;
        height: 78vh;      /* fallback on phones */
        min-height: 560px; /* fallback minimum */
      }
    }
  </style>
</head>

<body>
	<div class="embed-wrapper">
	  <div class="embed-frame">
		<iframe
		  id="twoxChatbotFrame"
		  src="https://twox-criteria-reference-guide-chat-bot.onrender.com/"
		  title="2X Criteria Assistant"
		  loading="lazy"
		  allow="clipboard-write"
		></iframe>
	  </div>
	</div>

  <script>
    window.addEventListener("message", function (event) {
      if (event.origin !== "https://twox-criteria-reference-guide-chat-bot.onrender.com") return;

      if (event.data && event.data.type === "twox-chatbot-resize") {
        const iframe = document.getElementById("twoxChatbotFrame");
        if (!iframe) return;

        const y = window.scrollY; // preserve scroll position
        iframe.style.height = event.data.height + "px";
        window.scrollTo(0, y);
      }

    });
  </script>
</body>
</html>
